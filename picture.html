<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picture Tag</title>
</head>
<body>

<picture>
    <source 
    media = "(max-width:600px)"
    srcset = "small.jpg"
    >

    <img src = "large.jpg"
    alt = "A mountain landscape"
    width = "600">
</picture>    

    
</body>
</html>
